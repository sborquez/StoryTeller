[project]
name = "story-teller"
version = "0.1.0"
description = "Create interactive text-based stories with LLMs"
authors = [
    { name = "Sebastian Borquez", email = "sebastian.borquez.g@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.6",
    "langchain-core>=0.3.21",
    "langchain-anthropic>=0.3.0",
    "langchain-ollama>=0.2.1",
    "langchain-openai>=0.2.11",
    "langgraph>=0.2.54",
    "python-dotenv>=1.0.1",
    "uvicorn>=0.32.1",
]

[dependency-groups]
dev = [
    "langsmith>=0.1.147",
    "mypy>=1.13.0",
    "ruff>=0.8.1",
    "setuptools>=75.6.0",
]

[tool.ruff]
line-length = 100
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    # We actually do want to import from typing_extensions
    "UP035",
    # Relax the convention by _not_ requiring documentation for every function parameter.
    "D417",
    "E501",
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
[tool.ruff.lint.pydocstyle]
convention = "google"
